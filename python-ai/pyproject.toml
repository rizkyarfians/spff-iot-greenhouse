[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spff-adaptive-ai"
version = "1.0.0"
description = "SPFF shadow-only adaptive irrigation evaluator"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.scripts]
spff-ai-shadow = "spff_ai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
